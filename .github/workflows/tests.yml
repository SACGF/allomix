name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # No 3.14: bioutils 0.6.2 (a runtime dep) declares requires-python <3.14.
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Lean [test] extra: no WeasyPrint, so the PDF tests self-skip (they
          # need system Pango/Cairo/HarfBuzz libraries). See pyproject.toml.
          pip install -e ".[test]"

      - name: Run tests
        run: python -m pytest tests/ -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: ruff check
        run: ruff check src/ tests/

      - name: ruff format
        run: ruff format --check src/ tests/

  paper-lint:
    # Flags claim words beside {{ facts }} that no word filter or {% assert %}
    # checks, and result-like numbers typed into the prose. Needs no facts CSVs,
    # so it runs on a bare checkout.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install vibepaper
        run: |
          python -m pip install --upgrade pip
          # Pinned to vibepaper main for claims sidecars; switch back to a PyPI
          # release ("vibepaper>=0.13") once one is out (also in pyproject.toml).
          pip install "vibepaper @ git+https://github.com/SACGF/vibepaper@45053ae"

      - name: vibepaper lint
        run: vibepaper lint --numbers --check

      # Parses every {% assert %} and [claims] test. With no facts CSVs each
      # assert reports MISSING, which does not fail; a broken assert (unknown
      # claim test, syntax error) reports ERROR and does.
      - name: vibepaper check
        run: vibepaper check --check
