# Claims for results.md (vibepaper claims sidecar, see the
# README's "Claims sidecars"). A quote must match one sentence.

[[claim]]
quote = "At the lowest titration (0.5% recipient, ...)"
assert = "srp434573.dilution_min_pct == srp434573.lowest_known_pct"
message = "'At the lowest titration (0.5% recipient, ...)'"

[[claim]]
quote = "all three contributors close to"
assert = "srp434573.three_m2_est_pct > srp434573.three_m1_est_pct and srp434573.three_m2_est_pct > srp434573.three_f2_est_pct"
message = "three-person mixture: 'ordered the two donors correctly' and 'the dominant genome is a donor (M2)'"

[[claim]]
quote = "resolved all three contributors close to their known fractions"
assert = "srp434573.three_f2_est_pct is close_to(srp434573.three_f2_known_pct) and srp434573.three_m1_est_pct is close_to(srp434573.three_m1_known_pct) and srp434573.three_m2_est_pct is close_to(srp434573.three_m2_known_pct)"
message = "three-person mixture: 'resolved all three contributors close to their known fractions'"

[[ok]]
quote = "over the range at or above 2.5% (R^2 = … for estimated versus"
reason = "'over the range' and 'estimated versus known' name the fit, not a comparison"

[[ok]]
quote = "with all …"
reason = "the range is the min and max over those same admixtures, true by construction"

[[claim]]
quote = "most plausibly index hopping on the patterned flowcell, which the source study independently identified in these data as index misassignment.[@Chu2024mipsnp] allomix establishes it from the data by a dose-response argument rather than assuming it: at consensus-homozygous sites (recipient and donor both homozygous for the same allele, so the minor allele cannot come from either contributor), the median per-site minor-allele fraction rises with the number of other co-pooled panel individuals carrying that allele, from … at the … sites with no"
assert = "srp_contam.n_dose_nonrising_steps == 0 and srp_contam.nocarrier_floor_pct < srp_contam.dose_1carrier_pct < srp_contam.dose_5carrier_pct"
message = "'the median per-site minor-allele fraction rises with the number of ... carriers' and 'That monotonic rise'"

[[claim]]
quote = "All ... of ... two-person mixtures gate in"
assert = "srp434573.correction_n_gated == srp434573.correction_n_mixtures"
message = "'All ... of ... two-person mixtures gate in'"

[[claim]]
quote = "the clean pairs self-selecting to a zero slope"
assert = "srp434573.correction_slope_min_pct == 0 and srp434573.correction_slope_max_pct > 0"
message = "'slopes up to ...', with 'the clean pairs self-selecting to a zero slope'"

[[claim]]
quote = "pulls the pure-donor ... endpoints down from a maximum of ... (median ... to ...)"
assert = "srp434573.endpoint_floor_max_corrected_pct < srp434573.endpoint_floor_max_baseline_pct and srp434573.endpoint_floor_median_corrected_pct <= srp434573.endpoint_floor_median_baseline_pct"
message = "'pulls the pure-donor ... endpoints down from a maximum of ... (median ... to ...)'"

[[claim]]
quote = "slightly tightens the at-or-above-2.5% error"
assert = "srp434573.mae_reliable_pct <= srp434573.mae_reliable_baseline_pct"
message = "'slightly tightens the at-or-above-2.5% error'"

[[claim]]
quote = "the 0.5% mean is essentially unchanged"
assert = "srp434573.mle_lowest_mean_pct is essentially_unchanged(srp434573.mle_lowest_mean_baseline_pct)"
message = "'the 0.5% mean is essentially unchanged'"

[[claim]]
quote = "all at the lowest recipient fractions (... to 1%)"
assert = "srp434573.n_review == 0 or srp434573.review_max_known_pct <= 1"
message = "QC REVIEW flags 'all at the lowest recipient fractions (... to 1%)'"

[[check]]
assert = "qc_gating.n_review_clinical == srp434573.n_review"
message = "the gating comparison's clinical REVIEW count is the same flag count quoted at the start of the paragraph"

[[claim]]
quote = "holds the flag count at ... rather than the ... a p-value-only rule raises"
assert = "qc_gating.n_review_clinical < qc_gating.n_review_legacy"
message = "'holds the flag count at ... rather than the ... a p-value-only rule raises'"

[[ok]]
quote = "(post-trim reduced chi-squared"
reason = "the statistic's name"

[[claim]]
quote = "downward rather than upward"
assert = "srp434573.mle_lowest_mean_pct < srp434573.lowest_known_pct"
message = "Figure 1 caption: the 0.5% points fall away 'downward rather than upward'"

[[ok]]
quote = ["fraction versus allomix", "known versus estimated"]
reason = "axis labels"

[[claim]]
quote = "the median estimate rising in step with the nominal one"
assert = "srp434573_synthetic.mle_med_0p1 < srp434573_synthetic.mle_med_0p5"
message = "semi-synthetic ladder: 'the median estimate rising in step with the nominal one'"

[[claim]]
quote = "a small constant positive offset"
assert = "srp434573_synthetic.two_person_med_signed_off_pct > 0"
message = "semi-synthetic ladder: 'a small constant positive offset'"

[[claim]]
quote = "upward, reading only the donor-homozygous"
assert = "srp434573_synthetic.detect_rate_0p1 < 1 and srp434573_synthetic.full_detect_min_pct > srp434573_synthetic.frac_min_pct"
message = "semi-synthetic ladder: presence detection 'climbed' from below full at the lowest rung to full detection"

[[claim]]
quote = "scatter around truth"
assert = "srp434573_synthetic.three_host_med_signed_err_pct > 0"
message = "two-donor series: 'a near-constant positive offset'"

[[check]]
assert = "srp434573_synthetic.three_host_lowest_ratio > 1"
message = "two-donor series: '-fold overestimate' at the lowest rung"

[[claim]]
quote = ["scatter around truth", "offset dominates at"]
assert = "srp434573_synthetic.three_host_med_signed_err_pct > srp434573_synthetic.three_host_lowest_known_pct"
message = "two-donor series: 'that offset dominates at the bottom' (offset larger than the lowest known recipient fraction)"

[[claim]]
quote = "reduces the offset"
assert = "srp434573_synthetic.two_person_offset_reduction_fold > 1.5"
message = "per-marker-type fit 'reduces the offset' relative to the shared fit"

[[claim]]
quote = "though it does not eliminate it"
assert = "srp434573_synthetic.two_person_med_signed_off_pct > 0"
message = "'though it does not eliminate it' (offset still positive)"

[[claim]]
quote = "unchanged by the overdispersion model ... under both the shared and the per-marker-type fit"
assert = "srp434573_synthetic.three_host_shared_minus_default_err_pct is unchanged(0)"
message = "two-donor offset 'unchanged by the overdispersion model ... under both the shared and the per-marker-type fit'"

[[claim]]
quote = ["points under both", "most likely source, though this dataset has no"]
assert = "srp434573_synthetic.three_host_med_signed_err_pct is comparable_to(srp434573.contam_floor_median_pct)"
message = "two-donor offset 'comparable to the co-pooled contamination floor'"

[[claim]]
quote = "donor chimerism rising"
assert = "srp434573_timeline.host_start_pct > srp434573_timeline.host_end_pct"
message = "timeline: 'declining-chimerism series', 'dilution from ... down to ...', 'donor chimerism rising'"

[[claim]]
quote = "decline with … mean absolute error across the … rungs, tracking the known fraction down to 1% recipient before the estimate floors near the dataset's co-pooled contamination level (~ … ) at the 0.5% rung, and the residual-recipient presence test returned a positive call at all"
assert = "srp434573_timeline.presence_n_detected == srp434573_timeline.n_timepoints"
message = "timeline: presence test 'returned a positive call at all ... timepoints'"

[[claim]]
quote = "mean absolute error below 1% from 50x to 1,000x"
assert = "depth_summary.mae_max_pct < 1"
message = "timeline: 'mean absolute error below 1% from 50x to 1,000x'"

[[claim]]
quote = "rung; the residual-recipient presence test returned a positive call at all … timepoints."
assert = "srp434573_timeline.presence_n_detected == srp434573_timeline.n_timepoints"
message = "Figure 2 caption: presence test 'returned a positive call at all ... timepoints'"

[[claim]]
quote = "returned a positive call (p < 0.05) at all ... of ... two-person admixtures"
assert = "srp434573.presence_n_detected == srp434573.presence_n_total"
message = "presence test: 'returned a positive call (p < 0.05) at all ... of ... two-person admixtures'"

[[claim]]
quote = "zero: each pair's pure-donor sample, the donor's own DNA piled through the identical mpileup path, is a genuine 0%-recipient input, and the test correctly withheld a recipient-present call at all"
assert = "srp434573.zero_host_presence_absent_n == srp434573.zero_host_n"
message = "presence test: 'correctly withheld a recipient-present call at all ... of ... pure-donor controls'"

[[claim]]
quote = "(recipient-fraction estimate 0%)"
assert = "srp434573.zero_host_presence_max_pct == 0"
message = "presence test: '(recipient-fraction estimate 0%)' at the pure-donor controls"

[[claim]]
quote = "rate rising from"
assert = "srp434573_synthetic.detect_rate_0p1 < 1 and srp434573_synthetic.full_detect_min_pct > srp434573_synthetic.frac_min_pct and srp434573_synthetic.full_detect_min_pct < 0.5"
message = "presence test: detects residual recipient 'below 0.5%', rising from 0.1% recipient to full"

[[ok]]
quote = "the lowest 0.5%"
reason = "the design's lowest titration level"

[[claim]]
quote = "the LoD fell with both panel size and depth"
assert = "subsample_lod_headline.mle_lod_250x_50markers_pct >= subsample_lod_headline.mle_lod_1000x_100markers_pct >= subsample_lod_headline.mle_lod_2000x_400markers_pct and subsample_lod_headline.presence_lod_250x_50markers_pct >= subsample_lod_headline.presence_lod_1000x_100markers_pct >= subsample_lod_headline.presence_lod_2000x_400markers_pct"
message = "real-data LoD: 'the LoD fell with both panel size and depth'"

[[check]]
assert = "subsample_lod_headline.high_min_titration_pct == 1"
message = "real-data LoD: 'mixtures titrated only to 1%'"

[[claim]]
quote = "lowest real titration), and the dataset's co-pooled contamination floor (a median … at the deepest, largest"
assert = "subsample_lod_headline.contamination_floor_pct < subsample_lod_headline.min_titration_pct"
message = "real-data LoD: contamination floor 'sits beneath' the lowest titration"

[[claim]]
quote = "titrated only to 1% (top)"
assert = "subsample_lod_headline.high_min_titration_pct == 1"
message = "Figure 3 caption: 'titrated only to 1% (top)'"

[[claim]]
quote = "rose to … (residual recipient … ), reflecting the smaller"
assert = "lod_headline.sibling_lod_1000x_100markers_pct > lod_headline.unrelated_lod_1000x_100markers_pct and presence_lod_curve_headline.presence_sibling_lod_1000x_100markers_pct > presence_lod_curve_headline.presence_unrelated_lod_1000x_100markers_pct"
message = "in silico LoD: 'with full-sibling donors ... the magnitude LoD rose to ...'"

[[claim]]
quote = "the smaller number"
assert = "presence_lod_curve_headline.presence_unrelated_lod_1000x_100markers_pct >= presence_lod_curve_headline.presence_unrelated_lod_2000x_400markers_pct and presence_lod_curve_headline.presence_sibling_lod_1000x_100markers_pct >= presence_lod_curve_headline.presence_sibling_lod_2000x_400markers_pct"
message = "in silico LoD: 'Both readouts improve ... with panel size and depth' (spot check: 1,000x/100 markers vs 2,000x/400 markers)"

[[ok]]
quote = "commercial NGS chimerism kits (0.06--0.5%)"
reason = "vendor figures from Table 1's cited sources"

[[ok]]
quote = "mixtures); ~0.1-0.2% (analytical"
reason = "range pinned by the analytical-floor assert after this table"

[[claim]]
quote = "(the lowest fraction"
assert = "lod_headline.unrelated_lod_1000x_100markers_pct >= 0.05 and lod_headline.unrelated_lod_1000x_100markers_pct < 0.25 and presence_lod_curve_headline.presence_unrelated_lod_1000x_100markers_pct >= 0.05 and presence_lod_curve_headline.presence_unrelated_lod_1000x_100markers_pct < 0.25"
message = "Table 1: analytical floor '0.1% to 0.2%' (both in silico LoDs round to 0.1 or 0.2)"

[[check]]
assert = "subsample_lod_headline.mle_lod_2000x_400markers_pct <= subsample_lod_headline.min_titration_pct"
message = "Table 1 caption: '<=0.5% on the same mixtures subsampled to the largest panel and deepest coverage'"

[[ok]]
quote = "lowest fraction they measured reproducibly (they also ran mixtures down to 0.05%).[@Kakodkar2023alloseq] The allomix cell lists the LoD by evidence class, from most to least real: ~ … on real titrated mixtures (SRP434573) at the reference operating point (100 markers, 1,000x mean depth), an EP17-A2 LoD; ≤0.5% on the same mixtures subsampled to the largest"
reason = "'most/least real' orders evidence classes, not values"

[[ok]]
quote = "pair under the"
reason = "'under' means following the EP17-A2 workflow"

[[claim]]
quote = "the mean number of informative markers fell from ... (unrelated) to ... (full sibling)"
assert = "rel_unrelated.mean_informative > rel_sibling.mean_informative"
message = "relatedness: 'the mean number of informative markers fell from ... (unrelated) to ... (full sibling)'"

[[claim]]
quote = "mean absolute error stayed below 2% throughout"
assert = "rel_unrelated.mean_mae_pct < 2 and rel_cousin.mean_mae_pct < 2 and rel_half_sibling.mean_mae_pct < 2 and rel_sibling.mean_mae_pct < 2"
message = "relatedness: 'mean absolute error stayed below 2% throughout'"

[[claim]]
quote = "stayed well above the three required"
assert = "rel_sibling.min_informative >= 6"
message = "relatedness: minimum informative count 'stayed well above the three required' (at least double)"

[[claim]]
quote = "all ... asymmetric mixes were correctly ranked"
assert = "multidonor.n_rank_correct == multidonor.n_asymmetric"
message = "multi-donor: 'all ... asymmetric mixes were correctly ranked'"

[[claim]]
quote = "Per-donor CI coverage was lower"
assert = "multidonor.ci_coverage_d1_pct < 95 and multidonor.ci_coverage_d2_pct < 95"
message = "multi-donor: 'Per-donor CI coverage was lower' (below nominal 95%)"

[[ok]]
quote = "at least one"
reason = "'at least one donor' defines the count"

[[claim]]
quote = "across every CNV"
assert = "cnv_loh_headline.relapse_lod_max_pct <= 3 * cnv_loh_headline.relapse_lod_baseline_unrel_pct"
message = "CNV: relapse direction 'CNVs had a modest effect' (worst cell within 3x of the unrelated baseline)"

[[claim]]
quote = "returning the high-burden gain donor LoD from ... to ..."
assert = "cnv_loh_headline.donor_lod_gain_high_unrel_robust_pct < cnv_loh_headline.donor_lod_gain_high_unrel_std_pct"
message = "CNV: refit 'returning the high-burden gain donor LoD from ... to ...'"
